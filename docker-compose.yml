services:
  black-rose-dnd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: black-rose-dnd
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-black_rose_dnd_super_secret_jwt_key_2026}
      - CARDS_PATH=/app/reference_data/magic_cards
    volumes:
      # Persistent SQLite database storage
      - ./backend/data:/app/backend/data
      # Read-only mount of magic card images
      - ./reference_data/magic_cards:/app/reference_data/magic_cards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
